apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-chat-backend
  namespace: support-chat-dev
  labels:
    app: support-chat-backend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-chat-backend
  template:
    metadata:
      labels:
        app: support-chat-backend
        environment: dev
    spec:
      containers:
        - name: backend
          image: shiftrobin/support-chat-backend:dev-7d684b8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: development
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
