apiVersion: v1
kind: Service
metadata:
  name: support-chat-frontend
  namespace: support-chat-prod
  labels:
    app: support-chat-frontend
    environment: prod
spec:
  type: ClusterIP
  selector:
    app: support-chat-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
