name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - prod

  pull_request:
    branches:
      - main
      - dev
      - stage
      - prod
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  ci:
    name: CI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  verify:
    name: Verify Environment
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ github.ref_name }}"
          echo "Pipeline validation completed successfully."

      - name: Verify repository
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"

  deploy-dev:
    name: Deploy to Dev
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' }}
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev
        run: |
          echo "Manual Dev deployment approved."
          echo "Environment: dev"
          echo "Commit: ${{ github.sha }}"
          echo "Dev deployment completed successfully."

  deploy-stage:
    name: Deploy to Stage
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/stage' }}
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: stage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Stage
        run: |
          echo "Manual Stage deployment approved."
          echo "Environment: stage"
          echo "Commit: ${{ github.sha }}"
          echo "Stage deployment completed successfully."

  deploy-prod:
    name: Deploy to Production
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.base.ref == 'prod' }}
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Production deployment triggered automatically."
          echo "Environment: prod"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Production deployment completed successfully."